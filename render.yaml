services:
  # The API Web Service
  - type: web
    name: karma-api
    env: node
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm -r build
    startCommand: cd apps/api && pnpm migrate && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: LOG_LEVEL
        value: info
      # Provided by Render PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: karma-db
          property: connectionString
      # To be filled by user in Render Dashboard
      - key: REDIS_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: CORS_ORIGIN
        value: "*" # Change to the deployed admin URL later

  # The Admin Web Dashboard (Static Site)
  - type: web
    name: karma-admin
    env: static
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm -r build
    staticPublishPath: apps/admin/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: karma-api
          property: url
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false

  # The Landing Page (Static Site)
  - type: web
    name: karma-landing
    env: static
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm -r build
    staticPublishPath: apps/landing/dist

databases:
  - name: karma-db
    plan: free
    postgresMajorVersion: 15
